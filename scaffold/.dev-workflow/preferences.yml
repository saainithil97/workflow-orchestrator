workflow:
  pipeline:
    preset: standard          # minimal | standard | full
  branching_strategy: trunk-based
  commit_convention: conventional-commits
  enforcement: warn           # warn | strict
  max_learnings: 20

# Additional workflow settings (uncomment to override defaults):
# workflow:
#   review_dimensions:
#     api-design: true
#     concurrency: false
#     scalability: true
#     observability: true
#     accessibility: false
#     i18n: false
#     data-integrity: true
#
#   # Pipeline configuration
#   # Controls which stages run during /workflow and enforces skip behavior for individual /commands.
#   #
#   # Presets define the default set of stages:
#   #   minimal  → requirement, lld, implement, review
#   #   standard → requirement, hld, lld, implement, review, docs, retro  (default)
#   #   full     → requirement, hld, lld, implement, review, observe, staging, docs, retro
#   #
#   # Per-stage overrides take priority over the preset.
#   # Mandatory stages (requirement, lld, implement, review) CANNOT be disabled.
#   #
#   pipeline:
#     # Per-stage overrides (uncomment and set to override the preset):
#     # hld: true               # include HLD stage
#     # observe: false          # skip /observe step
#     # staging: false          # skip /staging step
#     # docs: true              # include /docs step
#     # retro: true             # include /retro step
#
#     # Optional: run pipeline stages concurrently when their gates are satisfied.
#     # Only stages that do not conflict (write different files) should share a group.
#     # Safe built-in groups (already validated for file conflicts):
#     # parallel_groups:
#     #   - [observe, staging]  # both gate on review pass; observe writes instrumentation,
#     #                         # staging deploys + appends to LLD — no conflict
#     #   - [docs, retro]       # both gate on review/staging; docs writes doc files,
#     #                         # retro writes learnings — no conflict
#
#   # Model routing — assign a model per agent role.
#   # Managed by /preferences, which auto-syncs to agents/*.md and .opencode/agents/*.md.
#   # Supported values depend on your Claude Code / OpenCode plan.
#   # Common values: opus | sonnet | haiku  (or provider-prefixed: anthropic/claude-opus-4)
#   # models:
#     # architect: opus         # complex design reasoning — HLD, LLD, requirement
#     # implementer: sonnet     # code generation — cost-effective for TDD cycles
#     # reviewer: opus          # thorough security + correctness analysis
#     # documenter: sonnet      # documentation sync — simpler reasoning task
#     # default: sonnet         # fallback for any unassigned role

